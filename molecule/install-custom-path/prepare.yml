- name: Prepare
  hosts: all
  become: true
  gather_facts: true
  pre_tasks:
    - name: Install unzip
      ansible.builtin.apt:
        update_cache: yes
        name: unzip

    - name: Create owner
      ansible.builtin.user:
        name: bob
        state: present
        create_home: yes
        shell: /bin/bash
        groups: []
        append: no
